<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Laboratory</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            overflow: hidden;
            background: linear-gradient(to bottom, #000000,#0a0a1a);
        }
        #canvas1{
          border: 0px solid white;
        }
        
        #mutateBtn{
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 16px;
            color: white;
            cursor: pointer;
            border-radius: 1px solid rgba(255, 255, 255, 0.2);
        }
        #mutateBtn:hover{
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas1"></canvas>
    <button id="mutateBtn"> New Mutation</button>
</body>
<script>
    const  canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');
    const mutateBtn = document.getElementById('mutateBtn');

    const SIZE = 700;



class Fractal{
    constructor(drawMode){
            //properties
this.lineWidth = Math.floor(Math.random() *11) +  4 ;
this.hue = Math.random() * 360;
this.sides = Math.floor(Math.random() *6) + 2 ;
this.maxLevel = 5;
this.spread = Math.random() * 0.5 + 0.4; 
this.scale = Math.random() * 0.1 + 0.7; 
this.branches = 4 ;
this.branchSize = 150;
this.drawMode = drawMode;
    }
    draw(ctx){
        



    ctx.lineWidth = this.lineWidth;
    
ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);
for(let i=0; i < this.sides ;i++){

    this.drawBranch(ctx,0);
    ctx.rotate(Math.PI * 2 / this.sides);
    
}
ctx.restore();
    }

    drawBranch(ctx,level){
        if (level > this.maxLevel)return;
    
   
    const lightness = 10 + level *6;
    if(this.drawMode === "branches"){
             ctx.strokeStyle = `hsl(${this.hue},100%,${lightness}%)`;
        ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(this.branchSize,0);
    ctx.stroke();
    }else if (this.drawMode === "circles"){
         ctx.fillStyle = `hsl(${this.hue + 10},100%,${lightness + 5}%)`;
    ctx.beginPath();
    ctx.arc(this.branchSize * 2,0,this.lineWidth*1.5,0,Math.PI *2);
    ctx.fill();
    }
    else if (this.drawMode === "sparks"){
        if(level === this.maxLevel - 4 && Math.random() < 0.05){
             ctx.fillStyle = `hsl(${this.hue + 10},100%,${lightness + 20}%)`;
        ctx.fillStyle = `hsl(${this.hue + 10},100%,${lightness + 20}%)`;
        ctx.globalAlpha = 0.6;
        for(let i=0; i<5; i++){
            ctx.save();
            ctx.translate(50,150);
            ctx.rotate((Math.PI *2 /5 )* i);
              ctx.beginPath();
        ctx.ellipse(0,8,4,50,0,0,Math.PI *2);
        ctx.fill();
        ctx.restore();

        }
         
      
        ctx.globalAlpha = 1;
        }
    
    }

    else if(this.drawMode === "electricity"){
        ctx.strokeStyle = `hsl(${this.hue},100%,${lightness}%)`;
         if(level < this.maxLevel - 2){
            ctx.save();
            ctx.lineWidth = 2;
            ctx.shawdowColor = `hsl(${this.hue},100%,90%)`;
            ctx.shadowBlur = 15-9;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.beginPath();    
            ctx.moveTo(0,0);
            ctx.lineTo(this.branchSize * 0.2,Math.random() *20 -10);
            ctx.lineTo(this.branchSize*0.4,Math.random() *40 -20);
            ctx.lineTo(this.branchSize*0.6,Math.random() *180 -90);
            ctx.lineTo(this.branchSize*0.8,Math.random() *100 -50);
            ctx.lineTo(this.branchSize,Math.random() *40 -20);
            ctx.stroke();
            ctx.restore();
    }
}

    for(let i=0; i<this.branches; i++){
        
    const position = this.branchSize - (this.branchSize / this.branches)*i;
         ctx.save();

    ctx.translate(position,0);
    ctx.scale(this.scale,this.scale);
     ctx.rotate(this.spread * i *2.5/this.branches - this.spread * 0.8);
    this.drawBranch(ctx,level +1);
    ctx.restore();
    }

    }
}
function  drawFractal(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const fractal = new Fractal("branches");
    fractal.draw(ctx);
    fractal.drawMode = "circles";
    fractal.draw(ctx);
    fractal.drawMode = "sparks";
    fractal.draw(ctx);
    fractal.drawMode = "electricity";
    fractal.draw(ctx);
}




mutateBtn.addEventListener('click',drawFractal);
  
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
        ctx.lineCap = 'round';
    ctx.shawdowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;
    drawFractal();
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

</script>
