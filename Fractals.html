<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Laboratory</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;    
            min-height: 100vh;
            background-color: black;
        }
        #canvas1{
          border: 2px solid white;
        }
    </style>
</head>
<body>
    <canvas id="canvas1"></canvas>
</body>
<script>
    const  canvas = document.getElementById('canvas1');
    const ctx = canvas.getContext('2d');

    const SIZE = 600;
    canvas.width = SIZE;
    canvas.height = SIZE;
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 10;

//properties
const sides = 3;

function drawFractal(){
ctx.save();
ctx.translate(SIZE/2,SIZE/2);
for(let i=0; i < sides ;i++){

    drawBranch(0);
    ctx.rotate(Math.PI * 2 / sides);
    
}
ctx.restore();
}
function drawBranch(level){
    if (level > 7)return;
    
    const branchSize = 100;
        ctx.beginPath();
    ctx.moveTo(0,0);//first point 
    ctx.lineTo(branchSize,0);//second point
    ctx.stroke();//render the line

    ctx.save();

    ctx.translate(branchSize,0);
    ctx.scale(0.7,0.7);
   

    ctx.save();
    ctx.rotate(0.8);
    drawBranch(level + 1);
    ctx.restore();

    ctx.save();
    ctx.rotate(-0.8);
    drawBranch(level + 1);
    ctx.restore();

    ctx.restore();

}

drawFractal();




</script>
